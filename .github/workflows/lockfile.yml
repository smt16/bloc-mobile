# Ensures pnpm-lock.yaml stays in sync with package.json on every PR.

name: Lockfile

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    name: Verify lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Detect lockfile drift
        run: |
          pnpm install --lockfile-only --ignore-scripts
          if ! git diff --exit-code -- pnpm-lock.yaml; then
            echo "::error::pnpm-lock.yaml is out of sync with package.json. Run 'pnpm install' locally and commit the updated lockfile."
            exit 1
          fi
